name: Publicar artículo diario

# Writing a 1,500-word article takes ~75-90s, which exceeds Vercel Hobby's 60s
# function cap. GitHub Actions has no such limit and runs the same script the
# operator runs locally. /api/blog/publish stays available for Vercel Cron on a
# plan with a longer timeout — see docs/blog-operations.md.
on:
  schedule:
    - cron: '0 13 * * *' # 07:00 in Mexico City (UTC-6)
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

# Two runs writing the same slug would race on the unique index.
concurrency:
  group: blog-daily
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The failure step opens an issue. Nothing else here writes to the repo.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run blog:agent
        env:
          BLOG_DATABASE_URL: ${{ secrets.BLOG_DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Unset = the agent falls back to a rotating seed keyword.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional. Unset = the hero image falls back to the static catalogue,
          # which repeats across articles. Free key: https://www.pexels.com/api/
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # A silent failure is a missing article nobody notices until the blog
      # looks stale. An issue arrives through GitHub's normal notification mail:
      # no extra service, no extra secret, no monthly bill.
      - name: Abrir un issue si falló
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(cat <<EOF
          El job blog-daily falló: no se escribió nada en la base de datos y el blog se queda sin artículo hoy.

          Log completo: $RUN_URL

          Causas habituales:
          - El guard de claims de salud rechazó los 3 borradores seguidos.
          - La Anthropic API se quedó sin saldo.
          - El título generado cayó en un slug ya publicado y el guard lo bloqueó (tema repetido).
          - Los 16 seeds quedaron sin keywords nuevas — hay que ampliar la lista de seeds.
          EOF
          )
          gh issue create --title "Blog diario: sin artículo el $(date -u +%F)" --body "$BODY"
