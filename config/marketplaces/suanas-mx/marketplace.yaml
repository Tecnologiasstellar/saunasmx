id: suanas-mx
slug: suanas-mx
name: Saunas México
domain: saunas.mx
# Hostnames that permanently redirect to the canonical domain above. Only list
# hostnames that actually resolve to this deployment — an alias for a domain
# nobody owns does nothing except imply we own it.
aliases:
  - www.saunas.mx
category: sauna
localization:
  locale: es-MX
  currency: MXN
  country: MX
theme: warm-wellness
questionnaire: ./questionnaire.json
matching: ./matching.yaml
# Optional: grades every submitted lead A/B/C for sale to providers. Omitted by
# pergolas-mx on purpose — see docs on lead-scoring config.
lead_scoring: ./lead-scoring.yaml
# Optional: a standalone visual 5-step pre-questionnaire at /disena-tu-sauna
# that hands its answers into /cotizar. Never graded — see lead-scoring above.
configurator: ./configurator.json
# Public header and footer links. Only destinations this marketplace actually
# publishes — the shared chrome renders exactly what is listed here.
nav:
  - label: Diseña tu sauna
    href: /disena-tu-sauna
  - label: Lugares para sauna
    href: /lugares
  - label: Construye tu sauna
    href: /proveedores
  - label: Ciencia
    href: /#ciencia
  - label: Blog
    href: /blog
# Biblioteca is deliberately absent from the menu until the first resources are
# approved — /biblioteca is live, but an empty section in the nav reads as a
# broken site. Restore the entry once the library has content.
#  - label: Biblioteca
#    href: /biblioteca
# The one public contact point. The footer, the contact page and the privacy
# notice all read this — change it here and it changes everywhere.
contact:
  # Named as the "responsable" in the privacy notice — the entity that answers
  # an ARCO request.
  legalName: Tecnologías Stellar
  email: tecnologiasstellar@gmail.com
  # Bare handles, no URLs and no @. Leave a network null until the account
  # actually exists: the icon still shows, marked "próximamente", instead of
  # linking to a profile that isn't there.
  social:
    instagram: null
    tiktok: null
features:
  providerProfiles: true
  providerPortal: true
  manualLeadReview: true
  whatsapp: false
  subscriptions: false
  successFees: false
  blog: true
  library: true
seo:
  defaultIndexing: true
  pageEligibility: provider_count_gte_2_and_local_value
  primaryCta: obtener-cotizaciones
